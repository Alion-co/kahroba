# ساخت نسخه‌ی وب کهربا و انتشار روی GitHub Pages
# با هر push روی شاخه‌ی main (یا دستی از تب Actions) اجرا می‌شود.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # آدرس سایت: https://<نام‌کاربری>.github.io/<نام‌مخزن>/
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # بازگشت به برنامه اگر صفحه‌ای مستقیم باز شد
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

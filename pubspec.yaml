name: kahroba
description: "کهربا — دفتر دیجیتال تعمیرکاران. رایگان و متن‌باز."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # پایگاه داده
  drift: ^2.31.0
  drift_flutter: ^0.2.0

  # تاریخ شمسی
  shamsi_date: ^1.0.0

  # فایل و عکس
  path: ^1.9.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2

  # تماس، پیامک، نقشه
  url_launcher: ^6.3.1

  # برچسب QR دستگاه
  qr_flutter: ^4.1.0

  # اشتراک تصویر رسید، کارت ویزیت و کارنامه
  share_plus: ">=11.0.0 <14.0.0"

  # میانبرهای آیکن برنامه
  quick_actions: ^1.1.0

  # بازیابی پشتیبان (انتخاب فایل)
  file_picker: ^13.2.0

  # اعلان نوبت‌ها و یادآور پشتیبان (بدون اینترنت)
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/kb/
    - assets/brand/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
